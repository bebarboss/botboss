name: Build Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Clean build directories
      run: |
        rm -rf build dist
    
    - name: Build macOS app
      run: |
        pyinstaller main.spec
    
    - name: Create DMG
      run: |
        chmod +x create_dmg.sh
        ./create_dmg.sh
    
    - name: Create ZIP
      run: |
        cd dist
        zip -r BOTBOSS-macOS.zip BOTBOSS.app
    
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOTBOSS-macOS-DMG
        path: dist/BOTBOSS.dmg
    
    - name: Upload ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOTBOSS-macOS-ZIP
        path: dist/BOTBOSS-macOS.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Clean build directories
      run: |
        if (Test-Path build) { Remove-Item -Recurse -Force build }
        if (Test-Path dist) { Remove-Item -Recurse -Force dist }
      shell: pwsh
    
    - name: Build Windows executable
      run: |
        pyinstaller main.spec
    
    - name: Create ZIP for Windows
      run: |
        Compress-Archive -Path dist\BOTBOSS.exe -DestinationPath dist\BOTBOSS-Windows.zip
      shell: pwsh
    
    - name: Upload Windows EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOTBOSS-Windows-EXE
        path: dist/BOTBOSS.exe
    
    - name: Upload Windows ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOTBOSS-Windows-ZIP
        path: dist/BOTBOSS-Windows.zip

  create-release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Display structure of downloaded files
      run: ls -R artifacts
    
    - name: Create Release using GitHub CLI
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "$TAG" \
          artifacts/BOTBOSS-macOS-DMG/BOTBOSS.dmg \
          artifacts/BOTBOSS-macOS-ZIP/BOTBOSS-macOS.zip \
          artifacts/BOTBOSS-Windows-EXE/BOTBOSS.exe \
          artifacts/BOTBOSS-Windows-ZIP/BOTBOSS-Windows.zip \
          --title "BOTBOSS $TAG" \
          --notes "## 🎉 BOTBOSS $TAG Release

Multi-platform release with macOS and Windows support!

### Downloads

**macOS:**
- BOTBOSS.dmg - DMG installer (recommended)
- BOTBOSS-macOS.zip - ZIP archive

**Windows:**
- BOTBOSS.exe - Portable executable
- BOTBOSS-Windows.zip - ZIP archive

### Installation

#### macOS
1. Download BOTBOSS.dmg
2. Double-click to open
3. Drag BOTBOSS to Applications folder
4. Right-click app → Open (first time only)

#### Windows
1. Download BOTBOSS.exe
2. Run the executable
3. Allow in Windows Defender if prompted

### Requirements
- macOS 11+ or Windows 10+
- Google Chrome installed

### Features
✅ Automatic ticket clicking
✅ User-friendly GUI
✅ Chrome debugging integration
✅ Scheduled automation"
