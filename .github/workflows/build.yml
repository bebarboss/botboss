name: Build Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build macOS app
      run: |
        pyinstaller main.spec
    
    - name: Create DMG
      run: |
        chmod +x create_dmg.sh
        ./create_dmg.sh
    
    - name: Create ZIP
      run: |
        cd dist
        zip -r BOTBOSS-macOS.zip BOTBOSS.app
    
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOTBOSS-macOS-DMG
        path: dist/BOTBOSS.dmg
    
    - name: Upload ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOTBOSS-macOS-ZIP
        path: dist/BOTBOSS-macOS.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build Windows executable
      run: |
        pyinstaller main.spec
    
    - name: Create ZIP for Windows
      run: |
        Compress-Archive -Path dist\BOTBOSS.exe -DestinationPath dist\BOTBOSS-Windows.zip
      shell: pwsh
    
    - name: Upload Windows EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOTBOSS-Windows-EXE
        path: dist/BOTBOSS.exe
    
    - name: Upload Windows ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOTBOSS-Windows-ZIP
        path: dist/BOTBOSS-Windows.zip

  create-release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Display structure of downloaded files
      run: ls -R artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/BOTBOSS-macOS-DMG/BOTBOSS.dmg
          artifacts/BOTBOSS-macOS-ZIP/BOTBOSS-macOS.zip
          artifacts/BOTBOSS-Windows-EXE/BOTBOSS.exe
          artifacts/BOTBOSS-Windows-ZIP/BOTBOSS-Windows.zip
        draft: false
        prerelease: false
        body: |
          ## 🎉 Release ${{ github.ref_name }}
          
          ### Downloads
          
          #### macOS
          - **BOTBOSS.dmg** - DMG installer (recommended)
          - **BOTBOSS-macOS.zip** - ZIP archive
          
          **Requirements:** macOS 11+, Google Chrome
          
          **Installation:**
          1. Download DMG or ZIP
          2. Open/Extract and move to Applications
          3. Right-click → Open (first time only)
          
          #### Windows
          - **BOTBOSS.exe** - Portable executable (recommended)
          - **BOTBOSS-Windows.zip** - ZIP archive
          
          **Requirements:** Windows 10+, Google Chrome
          
          **Installation:**
          1. Download EXE or ZIP
          2. Extract (if ZIP) and run BOTBOSS.exe
          3. Allow in Windows Defender if prompted
          
          ---
          
          ### First Launch
          
          **macOS:** Right-click → Open (bypass Gatekeeper)
          **Windows:** Click "More info" → "Run anyway" (bypass SmartScreen)
          
          ### Features
          - ✅ Automatic ticket clicking
          - ✅ User-friendly GUI
          - ✅ Chrome debugging integration
          - ✅ Scheduled automation
          
          **Full documentation:** [README.md](https://github.com/bebarboss/botboss/blob/main/README.md)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
