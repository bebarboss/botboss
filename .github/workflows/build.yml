name: Build Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Clean build directories
      run: |
        rm -rf build dist
    
    - name: Build macOS app
      run: |
        pyinstaller main.spec
    
    - name: Create DMG
      run: |
        chmod +x create_dmg.sh
        ./create_dmg.sh
    
    - name: Create ZIP
      run: |
        cd dist
        zip -r BOTBOSS-macOS.zip BOTBOSS.app
    
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOTBOSS-macOS-DMG
        path: dist/BOTBOSS.dmg
    
    - name: Upload ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOTBOSS-macOS-ZIP
        path: dist/BOTBOSS-macOS.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Clean build directories
      run: |
        if (Test-Path build) { Remove-Item -Recurse -Force build }
        if (Test-Path dist) { Remove-Item -Recurse -Force dist }
      shell: pwsh
    
    - name: Build Windows executable
      run: |
        pyinstaller main.spec
    
    - name: Create ZIP for Windows
      run: |
        Compress-Archive -Path dist\BOTBOSS.exe -DestinationPath dist\BOTBOSS-Windows.zip
      shell: pwsh
    
    - name: Upload Windows EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOTBOSS-Windows-EXE
        path: dist/BOTBOSS.exe
    
    - name: Upload Windows ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOTBOSS-Windows-ZIP
        path: dist/BOTBOSS-Windows.zip

  create-release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Display downloaded files
      run: find artifacts -type f
